# 部署形态:使用二次开发镜像 langflow-custom:latest(由 ../Dockerfile 构建),代码已打进镜像,无源码挂载
# 开发形态(源码挂载、改代码即生效)见 ../dev/docker-compose.yml
services:
  postgres:
    image: postgres:16-bookworm
    container_name: langflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: langflow  # pragma: allowlist secret
      POSTGRES_DB: langflow
    ports:
      - "5432:5432"
    volumes:
      - langflow-postgres:/var/lib/postgresql/data
    networks:
      - langflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  langflow:
    image: langflow-custom:latest
    container_name: langflow
    restart: unless-stopped
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - LANGFLOW_DATABASE_URL=postgresql://langflow:langflow@postgres:5432/langflow
      - LANGFLOW_CONFIG_DIR=/app/langflow
      - LANGFLOW_AUTO_LOGIN=true
      # Skip API key requirement (deprecated, not recommended
      - LANGFLOW_SKIP_AUTH_AUTO_LOGIN=true
      # 从同目录 .env 读取（docker-compose v2 按 compose 文件所在目录查找 .env）
      - AGENT_PLATFORM_API_URL=${AGENT_PLATFORM_API_URL:-http://localhost:8000/v1}
      # 禁用启动时自动创建和更新 Starter Projects（删除后不会再自动恢复）
      - LANGFLOW_CREATE_STARTER_PROJECTS=true
      - HIDE_GETTING_STARTED_PROGRESS=true
      # 让系统自动更新模板
      - LANGFLOW_UPDATE_STARTER_PROJECTS=true
      - LANGFLOW_MCP_SERVER_SOURCE=agent_platform  # / local
      # 部署机上若使用 stdio MCP 服务，需将 mcp-scripts 目录放到此路径（或按实际路径修改），
      # 并启用下方挂载；平台 API 返回的 stdio 服务使用相对路径 mcp-scripts/*.py
      - MCP_SERVER_WORKDIR=/root/projects/deep-agent  # for stdio mcp servers
    volumes:
      - langflow-data:/app/langflow
      # ========== MCP stdio 脚本挂载（按需启用） ==========
      # 平台 API 返回的 stdio 服务使用相对路径 mcp-scripts/*.py，
      # 需将脚本目录以 MCP_SERVER_WORKDIR 指向的相同路径挂入容器
      # - /root/projects/deep-agent/mcp-scripts:/root/projects/deep-agent/mcp-scripts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - langflow-net

volumes:
  langflow-postgres:
  langflow-data:

networks:
  langflow-net:
    driver: bridge
